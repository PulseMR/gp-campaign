<style>
:root { --bg: #f6f7f9; --surface: #fff; --ink: #1a1d21; --muted: #5f6670; --line: #d9dde3; --accent: #1c5cab; --bad: #c62828; color-scheme: light; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #0e0f11; --surface: #1a1c1f; --ink: #eceef1; --muted: #9aa1ab; --line: #30343a; --accent: #5b9be6; --bad: #ef6b6b; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #0e0f11; --surface: #1a1c1f; --ink: #eceef1; --muted: #9aa1ab; --line: #30343a; --accent: #5b9be6; --bad: #ef6b6b; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
form { width: 100%; max-width: 440px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 28px 24px; }
h1 { font-size: 20px; margin: 0 0 4px; }
p { margin: 0 0 18px; color: var(--muted); }
input[type=password] { width: 100%; padding: 10px 12px; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; }
input[type=password]:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
label { display: flex; gap: 8px; align-items: center; margin: 12px 0 18px; color: var(--muted); font-size: 14px; }
button { width: 100%; padding: 10px; font: inherit; font-weight: 600; color: #fff; background: var(--accent); border: 0; border-radius: 8px; cursor: pointer; }
button:disabled { opacity: .6; cursor: wait; }
#msg { min-height: 1.5em; margin: 12px 0 0; font-size: 14px; }
#msg.bad { color: var(--bad); }
.vh { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); border: 0; }
</style>

const KEY = "gpdash-key-" + E.id;
const $ = id => document.getElementById(id);
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const msg = (t, bad) => { $("msg").textContent = t; $("msg").className = bad ? "bad" : ""; };
const store = {
  get() { try { return localStorage.getItem(KEY); } catch (e) { return null; } },
  set(v) { try { localStorage.setItem(KEY, v); } catch (e) {} },
  del() { try { localStorage.removeItem(KEY); } catch (e) {} },
};
try { const t = localStorage.getItem("gp-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}

async function derive(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", salt: b64(E.salt), iterations: E.iter, hash: "SHA-256" }, base, 256));
}
// throws on a wrong key (AES-GCM authenticates the content)
async function decrypt(raw) {
  const key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
  const gz = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(E.iv) }, key, b64(E.ct));
  return new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
}
function show(html) { document.open(); document.write(html); document.close(); }
// ask the browser to save the password (Chrome / Edge show their "Save password?" prompt; other browsers
// offer it from the form itself); never waits more than a moment before the dashboard opens
async function offerSave(pw) {
  if (!$("save").checked || !window.PasswordCredential || !navigator.credentials) return;
  try {
    const cred = new PasswordCredential({ id: $("un").value, password: pw, name: "GP Campaign Dashboard" });
    await Promise.race([navigator.credentials.store(cred), new Promise(r => setTimeout(r, 1500))]);
  } catch (e) {}
}

// full-access pages (names, phones) never keep the key on the device: the page always asks for the password,
// which the browser's password manager may fill in
if (E.noRemember) { store.del(); $("rem").checked = false; $("remWrap").style.display = "none"; }
const saved = E.noRemember ? null : store.get();
if (saved) decrypt(b64(saved)).then(show, () => { store.del(); msg("Ο κωδικός άλλαξε. Πληκτρολογήστε τον νέο κωδικό.", true); });

$("f").onsubmit = async e => {
  e.preventDefault();
  $("go").disabled = true;
  msg("Άνοιγμα…");
  try {
    const pw = $("pw").value.trim();
    const raw = await derive(pw);
    const html = await decrypt(raw);
    if ($("rem").checked && !E.noRemember) store.set(btoa(String.fromCharCode(...raw)));
    await offerSave(pw);
    show(html);
  } catch (x) {
    msg("Λάθος κωδικός.", true);
    $("go").disabled = false;
    $("pw").select();
  }
};
})();
</script>
